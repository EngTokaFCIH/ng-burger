<div class="content d-flex align-items-center justify-content-center flex-column">
  <h2 class="text-light fw-bold mb-4">Book Now</h2>
  <form>
      <div class="input d-flex flex-column align-content-center justify-content-center">
        <label class="fw-medium text-light" for="Name">Name :</label>
        <input class="p-2" type="text" id="Name">
      </div>
      <div class="input d-flex flex-column align-content-center justify-content-center">
        <label class="fw-medium text-light" for="How-many">How many people :</label>
        <input class="p-2" type="number" min="1" max="5" id="How-many" >
      </div>
      <div class="input d-flex flex-column align-content-center justify-content-center">
        <label class="fw-medium text-light" for="Date">Date :</label>
        <input class="p-2" type="datetime-local" id="Date">
      </div>
      <div class="input d-flex flex-column align-content-center justify-content-center">
        <label class="fw-medium text-light" for="Message">Message :</label>
        <textarea class="p-2" name="Message" id="Message"></textarea>
      </div>
      <button class="btn px-2 py-2">Book</button>
  </form>
</div>
